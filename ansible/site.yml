---
- name: Baza dla wszystkich maszyn
  hosts: all
  gather_facts: true
  tasks:
    - name: Ustaw hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ustaw strefę czasu
      community.general.timezone:
        name: Europe/Warsaw

    - name: Zainstaluj pakiety
      ansible.builtin.dnf:
        name: [chrony, vim-enhanced, git, curl, tar, bash-completion, nano]
        state: present

    - name: Włącz chronyd
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true
    - name: Dodaj Hello World dla usera admin
      ansible.builtin.copy:
        dest: /home/Admin/helloworld.txt
        content: "hello world\n"
        owner: Admin
        group: Admin
        mode: '0644'