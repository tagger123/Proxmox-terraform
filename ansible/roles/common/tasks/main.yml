- name: Ustaw hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Zainstaluj pakiety
  ansible.builtin.dnf:
    name: [chrony, vim-enhanced, git, curl, tar, bash-completion]
    state: present

- name: Włącz chronyd
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true
