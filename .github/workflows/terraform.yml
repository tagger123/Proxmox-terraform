name: terraform
on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
  TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
  TF_STATE_PATH: /var/lib/homelab-tfstate/terraform.tfstate

jobs:
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - run: terraform init -input=false -backend-config="path=${TF_STATE_PATH}"
      - run: terraform validate
      - run: terraform plan -input=false

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - run: terraform init -input=false -backend-config="path=${TF_STATE_PATH}"
      - run: terraform apply -input=false -auto-approve